server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options        DENY always;
    add_header X-Content-Type-Options  nosniff always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header X-Gateway               "openresty" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","gateway":"openresty"}';
    }

    location = /product.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;

        proxy_pass         http://keycloak/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Port   $server_port;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location /api/auth/ {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location /api/ {
        limit_req zone=api_ratelimit burst=40 nodelay;

        access_by_lua_file /etc/nginx/lua/jwt_verify.lua;

        proxy_pass         http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location /resources/ {
        proxy_pass         http://keycloak/resources/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    location /js/ {
        proxy_pass         http://keycloak/js/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location / {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }
}
