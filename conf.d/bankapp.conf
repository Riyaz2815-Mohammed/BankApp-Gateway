server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Internal-only HTTP listener — used by Next.js for Keycloak backchannel calls
# (token exchange, userinfo, JWKS).  Injects X-Forwarded headers so Keycloak
# stamps tokens with the public https://localhost issuer even on internal calls.
server {
    listen 8081;
    server_name _;

    # Modified OIDC discovery for Next.js: public issuer + internal endpoint URLs.
    # Next.js can't reach https://localhost from inside Docker (loopback ≠ gateway),
    # so we rewrite token/userinfo/jwks_uri to http://gateway:8081 while keeping
    # the issuer as the public https://localhost URL for ?iss + JWT iss validation.
    location = /auth/realms/bankapp/.well-known/openid-configuration {
        content_by_lua_block {
            local http = require("resty.http")
            local httpc = http.new()
            local res, err = httpc:request_uri(
                "http://keycloak:8080/auth/realms/bankapp/.well-known/openid-configuration",
                {
                    method  = "GET",
                    headers = {
                        ["Host"]              = "localhost",
                        ["X-Forwarded-Proto"] = "https",
                        ["X-Forwarded-Host"]  = "localhost",
                        ["X-Forwarded-Port"]  = "443",
                    }
                }
            )
            if not res or res.status ~= 200 then
                ngx.status = 502
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"error":"discovery unavailable"}')
                return
            end
            local body = res.body
            local pub = '"https://localhost/auth/realms/bankapp/protocol/openid%-connect/'
            local int = '"http://gateway:8081/auth/realms/bankapp/protocol/openid-connect/'
            for _, ep in ipairs({"token","userinfo","certs","logout","revoke","introspect"}) do
                body = body:gsub(pub .. ep .. '"', int .. ep .. '"')
            end
            ngx.header["Content-Type"]  = "application/json"
            ngx.header["Cache-Control"] = "no-store"
            ngx.print(body)
        }
    }

    location /auth/ {
        proxy_pass         http://keycloak/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              localhost;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  localhost;
        proxy_set_header   X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options        DENY always;
    add_header X-Content-Type-Options  nosniff always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header X-Gateway               "openresty" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","gateway":"openresty"}';
    }

    location = /product.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /auth/ {
        limit_req zone=auth_ratelimit burst=10 nodelay;

        proxy_pass         http://keycloak/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Port   $server_port;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location /api/auth/ {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location /api/ {
        limit_req zone=api_ratelimit burst=40 nodelay;

        access_by_lua_file /etc/nginx/lua/jwt_verify.lua;

        proxy_pass         http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }

    location / {
        proxy_pass         http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        log_by_lua_file /etc/nginx/lua/logger.lua;
    }
}
