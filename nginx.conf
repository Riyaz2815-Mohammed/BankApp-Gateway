worker_processes auto;
error_log /var/log/nginx/error.log info;
pid /var/run/openresty.pid;

env KEYCLOAK_REALM_URL;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict jwks_cache 1m;

    log_format json_log escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"method":"$request_method",'
            '"host":"$host",'
            '"path":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"duration_ms":$request_time,'
            '"upstream":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_ms":"$upstream_response_time",'
            '"request_bytes":$request_length,'
            '"response_bytes":$body_bytes_sent,'
            '"client_ip":"$remote_addr",'
            '"forwarded_for":"$http_x_forwarded_for",'
            '"ssl_protocol":"$ssl_protocol",'
            '"ssl_cipher":"$ssl_cipher",'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer"'
        '}';

    access_log /var/log/nginx/access.log json_log;

    sendfile           on;
    keepalive_timeout  65;
    gzip               on;

    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_ratelimit:10m rate=5r/s;

    include /etc/nginx/conf.d/*.conf;
}
